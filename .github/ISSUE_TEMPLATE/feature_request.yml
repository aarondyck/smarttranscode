name: Question or feature request
description: Ask how something works, or suggest an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do?
      description: Describe the goal first; the how can come after.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Smart Transcode version
  - type: textarea
    id: extra
    attributes:
      label: Anything else
